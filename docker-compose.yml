services:
  # Unified image supporting both engines and Gradio web interface on port 7860
  unified:
    image: make-voice:v1
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - ./.cache/torch/hub/checkpoints:/root/.cache/torch/hub/checkpoints
      - ./.cache/huggingface:/root/.cache/huggingface
    ports:
      - "7860:7860"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: python GradioPage.py
    stdin_open: true
    tty: true

  # Standalone HebTTS / Valle service on port 7861
  hebtts:
    image: make-voice:hebtts
    build:
      context: .
      dockerfile: docker/hebtts/Dockerfile
    volumes:
      - .:/app
      - ./.cache/torch/hub/checkpoints:/root/.cache/torch/hub/checkpoints
      - ./.cache/huggingface:/root/.cache/huggingface
    ports:
      - "7861:7860"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: python GradioPage.py
    stdin_open: true
    tty: true

  # Standalone Zonos service on port 7862
  zonos:
    image: make-voice:zonos
    build:
      context: .
      dockerfile: docker/zonos/Dockerfile
    volumes:
      - .:/app
      - ./.cache/torch/hub/checkpoints:/root/.cache/torch/hub/checkpoints
      - ./.cache/huggingface:/root/.cache/huggingface
    ports:
      - "7862:7860"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: python engine/zonos/zonos/gradio_interface.py
    stdin_open: true
    tty: true
