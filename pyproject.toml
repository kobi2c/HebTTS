[project]
name = "hebtts"
version = "0.1.0"
description = "Hebrew Text to Speech using Valle and Zonos engines"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # HebTTS dependencies
    "audiocraft>=1.3.0",
    "encodec>=0.1.1",
    "gdown>=5.2.0",
    "lhotse",
    "librosa>=0.11.0",
    "matplotlib>=3.10.3",
    "numpy<2",
    "omegaconf>=2.3.0",
    "phonemizer>=3.3.0",
    "phonikud>=0.4.1",
    "torch>=2.4.0",
    "torchaudio>=2.4.0",
    "torchmetrics>=1.7.2",
    "xformers>=0.0.35",
    # Zonos dependencies
    "soundfile>=0.13.1",
    "transformers>=4.48.1",
    "huggingface-hub>=0.28.1",
    "inflect>=7.5.0",
    "kanjize>=1.5.0",
    "sudachipy>=0.6.10",
    "sudachidict-full>=20241021",
    "phonikud-onnx>=1.0.6",
    "gradio>=5.15.0",
]

[project.optional-dependencies]
compile = [
    "flash-attn>=2.7.3",
    "mamba-ssm>=2.2.4",
    "causal-conv1d>=1.5.0.post8",
]

[tool.uv]
no-build-isolation-package = ["flash-attn", "mamba-ssm", "causal-conv1d"]
override-dependencies = [
    "torch>=2.4.0",
    "torchaudio>=2.4.0",
    "av>=12.0.0",
    "xformers>=0.0.35",
]

[tool.uv.extra-build-dependencies]
causal-conv1d = ["setuptools", "torch"]
mamba-ssm = ["setuptools", "torch"]
flash-attn = ["setuptools", "torch"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
lhotse = { git = "https://github.com/lhotse-speech/lhotse" }
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
