[project]
name = "hebtts"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "audiocraft>=1.3.0",
    "encodec>=0.1.1",
    "gdown>=5.2.0",
    "lhotse",
    "librosa>=0.11.0",
    "matplotlib>=3.10.3",
    "numpy<2",
    "omegaconf>=2.3.0",
    "phonemizer>=3.3.0",
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "torchmetrics>=1.7.2",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
override-dependencies = [
    "torch>=2.4.0",
    "torchaudio>=2.4.0",
    "av>=12.0.0",
]

[tool.uv.sources]
lhotse = { git = "https://github.com/lhotse-speech/lhotse" }
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
